
name: Hello World CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python 3.11
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 3: Validate Python syntax (Exercise 8)
      - name: Validate Python syntax
        run: python -m py_compile app.py test_app.py

      # Step 4: Install dependencies
      - name: Install dependencies
        run: pip install pytest

      # Step 5: Run application
      - name: Run Hello World application
        run: python app.py

      # Step 6: Run automated tests
      - name: Run tests
        run: python -m pytest -v

      # Step 7: Upload build artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-world-package
          path: |
            app.py
            test_app.py

          

